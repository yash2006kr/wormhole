<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Jarvis Webmail - Inbox</title>
  <style>
    :root {
      --bg: #0b0e1a;
      --panel: #111425;
      --border: rgba(155, 170, 255, 0.15);
      --cyan: #79e8f3;
      --violet: #a38cff;
      --text: #edeaff;
      --muted: #8b92b2;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    header {
      background: var(--panel);
      border-bottom: 1px solid var(--border);
      padding: 14px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 15px;
      font-weight: 700;
      color: #fff;
    }
    .brand-icon {
      font-size: 20px;
      color: var(--cyan);
    }
    .user-pill {
      font-size: 11px;
      background: rgba(121, 232, 243, 0.1);
      border: 1px solid rgba(121, 232, 243, 0.3);
      color: var(--cyan);
      padding: 4px 10px;
      border-radius: 20px;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    main {
      flex: 1;
      display: flex;
      max-width: 1000px;
      width: 100%;
      margin: 20px auto;
      gap: 16px;
      padding: 0 16px;
    }
    .sidebar {
      width: 200px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .side-item {
      padding: 9px 14px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 600;
      color: var(--muted);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: space-between;
      transition: 0.2s;
    }
    .side-item.active {
      background: rgba(163, 140, 255, 0.15);
      color: #fff;
      border: 1px solid rgba(163, 140, 255, 0.3);
    }
    .mail-container {
      flex: 1;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 14px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }
    .mail-header {
      padding: 12px 18px;
      border-bottom: 1px solid var(--border);
      font-size: 12px;
      font-weight: 700;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.8px;
      display: flex;
      justify-content: space-between;
    }
    .mail-item {
      padding: 16px 20px;
      border-bottom: 1px solid var(--border);
      cursor: pointer;
      background: rgba(121, 232, 243, 0.03);
      transition: 0.2s;
    }
    .mail-item:hover {
      background: rgba(121, 232, 243, 0.08);
    }
    .mail-top-line {
      display: flex;
      justify-content: space-between;
      margin-bottom: 6px;
      font-size: 12px;
    }
    .mail-sender {
      font-weight: 700;
      color: #fff;
    }
    .mail-time {
      font-size: 11px;
      color: var(--muted);
    }
    .mail-subject {
      font-size: 13.5px;
      font-weight: 700;
      color: var(--cyan);
      margin-bottom: 10px;
    }
    .mail-body {
      font-size: 12.5px;
      line-height: 1.5;
      color: #d6d9ee;
    }
    .otp-code-card {
      margin: 16px 0 8px;
      background: rgba(8, 10, 20, 0.9);
      border: 1px solid rgba(121, 232, 243, 0.4);
      border-radius: 10px;
      padding: 14px 20px;
      display: flex;
      align-items: center;
      gap: 16px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.4);
    }
    .otp-label {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--muted);
    }
    .otp-number {
      font-family: ui-monospace, Consolas, monospace;
      font-size: 26px;
      font-weight: 800;
      letter-spacing: 4px;
      color: var(--cyan);
      text-shadow: 0 0 14px rgba(121, 232, 243, 0.5);
    }
  </style>
</head>
<body>

  <header>
    <div class="brand">
      <span class="brand-icon">✉️</span>
      <span>Jarvis Webmail</span>
    </div>
    <div class="user-pill">
      <span>●</span>
      <span id="user-display">yashwanth.kr.dbit@gmail.com</span>
    </div>
  </header>

  <main>
    <div class="sidebar">
      <div class="side-item active">
        <span>📥 Inbox</span>
        <span id="unread-count" style="color:var(--cyan); font-weight:700;">1</span>
      </div>
      <div class="side-item"><span>⭐ Starred</span></div>
      <div class="side-item"><span>📤 Sent</span></div>
      <div class="side-item"><span>🗑 Trash</span></div>
    </div>

    <div class="mail-container">
      <div class="mail-header">
        <span>Primary Messages</span>
        <span style="color: var(--cyan); cursor: pointer;" onclick="fetchMail()">🔄 Refresh</span>
      </div>

      <div id="mail-list">
        <!-- Rendered dynamically -->
      </div>
    </div>
  </main>

  <script>
    async function fetchMail() {
      try {
        const res = await fetch("/api/mock/latest_mail");
        const data = await res.json();
        const mail = data.email || {
          sender: "QuickHire Security System",
          email_from: "security@quickhire.io",
          subject: "Your Security Verification Code: 739214",
          otp: "739214",
          time: "Just now",
          body: "Hello Yashwanth, your single-use verification code for QuickHire Portal is provided below."
        };

        const list = document.getElementById("mail-list");
        list.innerHTML = `
          <div class="mail-item">
            <div class="mail-top-line">
              <span class="mail-sender">${mail.sender || 'QuickHire Security'} &lt;${mail.email_from || 'security@quickhire.io'}&gt;</span>
              <span class="mail-time">${mail.time || 'Just now'}</span>
            </div>
            <div class="mail-subject">${mail.subject || ('Your Verification Code: ' + mail.otp)}</div>
            <div class="mail-body">
              ${mail.body || 'Please enter this verification code in the QuickHire portal to complete your login:'}
            </div>
            <div class="otp-code-card">
              <div>
                <div class="otp-label">One-Time Password (OTP)</div>
                <div class="otp-number" id="mail-otp-code">${mail.otp}</div>
              </div>
              <div style="font-size:11px; color:var(--muted); margin-left:auto;">
                Valid for 10 minutes · Do not share
              </div>
            </div>
          </div>
        `;
      } catch(e) {
        console.error("fetchMail error:", e);
      }
    }

    // Auto-load on open and poll periodically
    fetchMail();
    setInterval(fetchMail, 2500);
  </script>
</body>
</html>
